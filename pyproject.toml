[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heurix"
version = "0.1.0"
description = "Deterministic Codebase Scanner & Automated YAML Synthesizer"
readme = "heurix.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Heurix Contributors" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "pydantic>=2.0.0",
    "pathspec>=0.12.0",
    "ruamel.yaml>=0.18.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
hx = "heurix.cli:app"
heurix = "heurix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
