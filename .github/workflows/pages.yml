name: Site

# Publishes the web frontend (site/), interactive playground, docs, llms.txt, and llms-full.txt
# to GitHub Pages on every push to main. In Repository Settings -> Pages, set Source to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir site build
        env:
          SITE_BASE: /heurix/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
