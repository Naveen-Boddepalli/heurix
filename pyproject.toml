[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heurix"
version = "0.3.0"
description = "Deterministic Codebase Scanner & Automated YAML Synthesizer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Heurix Contributors" }
]
keywords = [
    "ci-cd",
    "github-actions",
    "kubernetes",
    "yaml",
    "devops",
    "codebase-scanner",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "pydantic>=2.0.0",
    "pathspec>=0.12.0",
    "ruamel.yaml>=0.18.0",
    "jsonschema>=4.20.0",
    "jinja2>=3.1.6",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.17.0",
    "mypy>=2.0.0",
    "types-jsonschema",
    "setuptools>=61.0",
    "wheel>=0.40.0",
]
build = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "wheel>=0.40.0",
]
binary = [
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/Naveen-Boddepalli/heurix"
Repository = "https://github.com/Naveen-Boddepalli/heurix"
Issues = "https://github.com/Naveen-Boddepalli/heurix/issues"

[project.scripts]
hx = "heurix.cli:app"
heurix = "heurix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["heurix*"]
exclude = ["tests*", "docs*", "site*", "packaging*"]

[tool.setuptools.package-data]
heurix = ["templates/**/*.j2", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "SIM102",  # nested ifs often read more clearly than one long condition
    "SIM105",  # explicit try/except/pass is clearer than contextlib.suppress
    "SIM108",  # don't force ternaries
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017"]

[tool.mypy]
python_version = "3.10"
files = ["src/heurix"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["questionary.*", "pathspec.*", "tomli"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["heurix"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
