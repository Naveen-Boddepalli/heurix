name: Publish to PyPI & GitHub Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Target package repository'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Smoke test built wheel
        run: |
          set -euo pipefail
          SMOKE_DIR=$(mktemp -d)
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          python -m venv "${SMOKE_DIR}/venv"
          "${SMOKE_DIR}/venv/bin/pip" install --quiet dist/*.whl
          VER_OUT=$("${SMOKE_DIR}/venv/bin/hx" --version)
          echo "$VER_OUT" | grep -q "Heurix (hx)"
          HELP_OUT=$("${SMOKE_DIR}/venv/bin/hx" --help)
          echo "$HELP_OUT" | grep -q "Deterministic Codebase Scanner"
          mkdir -p "${SMOKE_DIR}/repo"
          printf '[project]\nname = "smoke-demo"\nversion = "0.1.0"\n' > "${SMOKE_DIR}/repo/pyproject.toml"
          SCAN_OUT=$("${SMOKE_DIR}/venv/bin/hx" scan --path "${SMOKE_DIR}/repo")
          echo "$SCAN_OUT" | grep -q '"python"'
          "${SMOKE_DIR}/venv/bin/hx" generate --path "${SMOKE_DIR}/repo" --dry-run --yes

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: write  # Required to attach artifacts to GitHub Releases
    environment:
      name: ${{ inputs.repository == 'testpypi' && 'testpypi' || 'pypi' }}
      url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/p/heurix' || 'https://pypi.org/p/heurix' }}
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        if: ${{ inputs.repository == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Publish to PyPI (API Token)
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        if: ${{ inputs.repository != 'testpypi' && env.PYPI_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (Trusted Publishing OIDC)
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        if: ${{ inputs.repository != 'testpypi' && env.PYPI_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          packages-dir: dist/

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67  # v3
        with:
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true
