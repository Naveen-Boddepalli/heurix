[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heurix"
version = "0.2.0"
description = "Deterministic Codebase Scanner & Automated YAML Synthesizer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Heurix Contributors" }
]
keywords = [
    "ci-cd",
    "github-actions",
    "kubernetes",
    "yaml",
    "devops",
    "codebase-scanner",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "pydantic>=2.0.0",
    "pathspec>=0.12.0",
    "ruamel.yaml>=0.18.0",
    "jsonschema>=4.20.0",
    "jinja2>=3.1.6",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "setuptools>=61.0",
    "wheel>=0.40.0",
]
build = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "wheel>=0.40.0",
]
binary = [
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/Naveen-Boddepalli/heurix"
Repository = "https://github.com/Naveen-Boddepalli/heurix"
Issues = "https://github.com/Naveen-Boddepalli/heurix/issues"

[project.scripts]
hx = "heurix.cli:app"
heurix = "heurix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["heurix*"]
exclude = ["tests*", "docs*", "site*", "packaging*"]

[tool.setuptools.package-data]
heurix = ["templates/**/*.j2", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
