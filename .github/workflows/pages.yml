name: Site

# Publishes the web frontend (site/), interactive playground, docs, llms.txt, and llms-full.txt
# to GitHub Pages on every push to main. In Repository Settings -> Pages, set Source to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3  # v6
        with:
          version: 10
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir site build
        env:
          SITE_BASE: /heurix/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
