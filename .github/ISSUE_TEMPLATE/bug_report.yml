name: Bug report
description: Heurix generated the wrong output, crashed, or reported something incorrect.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please report security issues privately instead, as described in [SECURITY.md](https://github.com/Naveen-Boddepalli/heurix/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Heurix version
      description: Output of `hx --version`.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - pipx
        - pip
        - Shell script (install.sh)
        - Docker image
        - From source
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: hx generate --dry-run
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Paste the output and the part of the generated YAML that's wrong.
      render: text
    validations:
      required: true
  - type: textarea
    id: repo
    attributes:
      label: Repository layout
      description: |
        A minimal repository that reproduces it is the most useful thing you can give us: a link, or the relevant files (lockfiles, version files, Dockerfile, docker-compose.yml, `.heurix.toml`, existing workflow). `hx scan` prints what Heurix detected.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: macOS 15, Python 3.12
