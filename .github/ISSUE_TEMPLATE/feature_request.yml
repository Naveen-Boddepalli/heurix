name: Feature request
description: Suggest a new detector, generated output, check, or option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The repository setup or workflow you have, and where Heurix falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should Heurix do?
      description: For example, which files it should read and what YAML it should produce. An example of the output you'd expect helps a lot.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: How you handle it now (a preserved step, a `.heurix.toml` override, another tool).
