<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- MANDATORY: Declare support for both light and dark themes -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var saved = localStorage.getItem('color-scheme');
        if (saved === 'light' || saved === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = saved;
        }
      } catch (e) {}
    </script>
    <title>Heurix (hx): CI config from your repo</title>
    <meta
      name="description"
      content="hx reads your lockfiles, version pins, and Dockerfiles and generates GitHub Actions, Dependabot, and Kubernetes YAML. Runs offline and merges into your existing files."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate" type="text/plain" title="llms.txt" href="llms.txt" />
    <meta property="og:title" content="Heurix (hx): CI config from your repo" />
    <meta
      property="og:description"
      content="Generates GitHub Actions, Dependabot, and Kubernetes YAML from what is in your repo, and keeps your edits when you re-run it."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
