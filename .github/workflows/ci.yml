# Synthesized deterministically by Heurix (hx)
# Non-destructive updates: preserve blocks marked with # @heurix:preserve
name: CI
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - docs/**
      - site/**
      - '**/*.md'
      - llms.txt
      - llms-full.txt
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - docs/**
      - site/**
      - '**/*.md'
      - llms.txt
      - llms-full.txt
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Lint code (python)
        run: ruff check .
      - name: Run tests (python)  # @heurix:preserve
        run: pytest -m "not perf" --cov=heurix --cov-report=term-missing:skip-covered
      - name: Run timing benchmarks (no coverage tracing)  # @heurix:preserve
        run: pytest -m perf
  quality:
    name: Format and type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Check formatting (ruff format)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy
      - name: Drift and workflow security check (hx check --security)
        run: hx check --security
